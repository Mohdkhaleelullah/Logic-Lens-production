# Grafana Dashboard Provisioning Config
apiVersion: 1

providers:
  - name: 'Logic Lens Dashboards'
    orgId: 1
    folder: 'Logic Lens'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
